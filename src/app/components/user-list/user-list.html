<div class="bg-gray-200 flex flex-col gap-2 p-10 min-h-screen">
  <div class="flex flex-row justify-between items-center">
    <div class="text-2xl font-medium text-gray-800">User List</div>
    <div>
      <button matButton="outlined" [showProgress]="showProgress()" class="rounded-2xl" (click)="addUser()">
        <div class="text-lg font-medium text-gray-500 ">Add user</div>
        <div progressIndicator role="progressbar" aria-valuemin="0" aria-valuemax="100">
          Loading...
        </div>
      </button>
    </div>
  </div>

  <div class="overflow-x-auto rounded-xl bg-white">
    <table class="table-auto w-full text-left">
      <thead class="">
        <tr class="bg-gray-100">
          <th class="py-2 rounded-l-xl">S.No.</th>
          <th>User Name</th>
          <th>Price</th>
          <th>Location</th>
          <th>Details</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (item of allUsers(); track item.id) {
          <tr>
            <td class="px-6 py-4">
              {{ $index + 1 }}
            </td>
            <td class="px-6 py-4">
              {{ item.pname }}
            </td>
             <td class="px-6 py-4">
              {{ item.pprice }}
            </td>
            <td class="px-6 py-4">
              {{ item.plocation }}
            </td>
             <td class="px-6 py-4">
              {{ item.pdetails }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <button matButton type="button" (click)="addUser(item)">Edit</button>
              <button matButton type="button" (click)="deleteUser(item.id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
